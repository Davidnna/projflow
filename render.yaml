services:
    -
        type: web
        name: projflow-api
        runtime: python
        plan: free
        region: frankfurt
        branch: main
        rootDir: backend
        buildCommand: pip install -r requirements.txt && python manage.py warm_topic_similarity_model && python manage.py check && python manage.py collectstatic --noinput
        startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
        healthCheckPath: /api/health/
        autoDeployTrigger: checksPass
        envVars:
            -
                key: DJANGO_SECRET_KEY
                generateValue: true
            -
                key: DJANGO_DEBUG
                value: "false"
            -
                key: DJANGO_SECURE_SSL_REDIRECT
                value: "true"
            -
                key: DJANGO_ALLOWED_HOSTS
                value: ".onrender.com,localhost,127.0.0.1"
            -
                key: DATABASE_URL
                sync: false
            -
                key: PROJFLOW_INITIAL_ADMIN_SETUP_TOKEN
                sync: false
            -
                key: CORS_ALLOWED_ORIGINS
                sync: false
            -
                key: CSRF_TRUSTED_ORIGINS
                sync: false
            -
                key: SUPABASE_URL
                sync: false
            -
                key: SUPABASE_SECRET_KEY
                sync: false
            -
                key: PROJFLOW_REPORTS_BUCKET
                value: projflow-project-reports
            -
                key: WEB_CONCURRENCY
                value: "1"
