name: ProjFlow CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

env:
    DJANGO_SECRET_KEY: "ci-only-not-for-production-use-a-32-character-or-longer-test-key"

jobs:
    backend:
        name: Backend tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            -
                name: Check out repository
                uses: actions/checkout@v4
            -
                name: Set up Python
                uses: actions/setup-python@v5
                with:
                    python-version-file: backend/.python-version
                    cache: pip
                    cache-dependency-path: backend/requirements.txt
            -
                name: Install dependencies
                run: python -m pip install -r requirements.txt
            -
                name: Check Django configuration
                run: python manage.py check
            -
                name: Check migration consistency
                run: python manage.py makemigrations --check --dry-run
            -
                name: Run backend tests
                run: python manage.py test

    frontend:
        name: Frontend production build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            -
                name: Check out repository
                uses: actions/checkout@v4
            -
                name: Set up Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: "24"
            -
                name: Install dependencies
                run: npm install --no-audit --no-fund
            -
                name: Build frontend
                run: npm run build

    postgres-migration:
        name: PostgreSQL migration and role-integrity tests
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: projflow
                    POSTGRES_PASSWORD: projflow-ci-password
                    POSTGRES_DB: projflow
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U projflow -d projflow"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DATABASE_URL: postgres://projflow:projflow-ci-password@localhost:5432/projflow
            DATABASE_SSL_REQUIRE: "false"
        defaults:
            run:
                working-directory: backend
        steps:
            -
                name: Check out repository
                uses: actions/checkout@v4
            -
                name: Set up Python
                uses: actions/setup-python@v5
                with:
                    python-version-file: backend/.python-version
                    cache: pip
                    cache-dependency-path: backend/requirements.txt
            -
                name: Install dependencies
                run: python -m pip install -r requirements.txt
            -
                name: Apply migrations on PostgreSQL
                run: python manage.py migrate --noinput
            -
                name: Run PostgreSQL role and completion regression tests
                run: >-
                    python manage.py test
                    apps.accounts.tests.RoleIntegrityMigrationTests
                    apps.accounts.tests.UserModelTests
                    apps.academics.tests.StudentLecturerBoundaryTests
                    apps.projects.test_completion.CompletionWorkflowTests
